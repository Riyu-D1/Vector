; SOMA v3 joint driver — ST B-G431B-ESC1 (STM32G431CB), one per J2/J3
; cycloidal actuator. Tarot TL2955 4008 330KV + 40:1 + AS5600 (motor side).
; Build: `pio run`   Flash: `pio run -t upload` (onboard ST-LINK, USB-C)
[platformio]
src_dir = .

[env:disco_b_g431b_esc1]
platform = ststm32@^17.0.0
board = disco_b_g431b_esc1
framework = arduino
; stm32duino core 3.x (framework-arduinoststm32@4.30000.0) changed
; enableTimerClock()'s signature and broke SimpleFOC — pin core 2.12.0,
; the newest pre-3.x package (see docs/firmware-verification.md)
platform_packages =
    platformio/framework-arduinoststm32@4.21200.0
    platformio/framework-cmsis-dsp
lib_deps =
    askuric/Simple FOC @ ^2.4.0
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -I ../shared
